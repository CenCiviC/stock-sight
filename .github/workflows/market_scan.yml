name: Market Scan — G1 + EMA9/SMA50 + EMA9/21

on:
  # GitHub cron은 보장이 아니다 — 몇 시간씩 밀리거나 통째로 건너뛴다.
  # 그래서 같은 세션을 세 번 노린다. scanner.ts가 이미 스캔한 세션이면
  # 바로 끝내므로 먼저 성공한 한 번만 커밋된다. 정각/30분은 GitHub 전체
  # 부하가 몰려 지연이 커서 :17분에 건다.
  #   22:17 UTC = 18:17 EDT / 17:17 EST (월~금 본 실행)
  #   01:17 UTC = 21:17 EDT / 20:17 EST (화~토, 전날 세션 예비)
  #   04:17 UTC = 00:17 EDT / 23:17 EST (화~토, 전날 세션 예비)
  schedule:
    - cron: "17 22 * * 1-5"
    - cron: "17 1 * * 2-6"
    - cron: "17 4 * * 2-6"

  # 수동 실행 (Actions 탭 → Run workflow)
  workflow_dispatch:

permissions:
  contents: write   # data/alerts/latest.json 자동 커밋용

# 예비 cron이 밀려서 본 실행과 겹치면 push가 충돌한다 — 한 번에 하나씩.
concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Run Stock Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 60   # NASDAQ 5000종목 처리에 여유 있게

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scanner/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scanner

      - name: Run scanner
        run: npx tsx scanner.ts
        working-directory: scanner
        env:
          # 수동 실행은 이미 스캔한 세션이어도 다시 돈다
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Commit alerts JSON
        run: |
          git config user.name  "CenCiviC"
          git config user.email "rudqls513@gmail.com"
          git add data/alerts/g1.json data/alerts/g1_history.json data/alerts/latest.json data/alerts/ema921.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(alerts): Update latest.json"
            git push
          fi
